[package]
name = "platform-core"
version = "0.1.0"
edition = "2021"

# cdylib produces the .node/.dylib/.so/.dll shared library for Node.js N-API.
# Single cross-platform crate: Windows and macOS backends are selected
# internally via #[cfg(target_os = "…")] in src/.
[lib]
crate-type = ["cdylib"]

# ── Core napi-rs dependencies ──────────────────────────────────────────────
[dependencies]
# napi4 is the minimum feature level required for ThreadsafeFunction
# (needed in later phases for cross-thread callbacks from the hook thread).
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

# Win32 bindings — only compiled on Windows targets.
# We declare only the features (Win32 modules) we actually use so compile
# times stay reasonable.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

# macOS bindings — only compiled on macOS targets.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
cocoa = "0.26"
objc = "0.2"

# ── Build dependencies ─────────────────────────────────────────────────────
[build-dependencies]
# napi-build emits the linker directives that make the .node file link
# correctly against node.exe (resolves NAPI symbols at runtime).
napi-build = "2.3"

# ── Profile ───────────────────────────────────────────────────────────────
[profile.release]
# Strip debug info from the .node binary for a smaller file.
strip = true
opt-level = 3
lto = true
