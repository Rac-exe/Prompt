    <title>Prmpt Overlay</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('prompt-weaver-settings');
          var theme = stored ? JSON.parse(stored).theme : 'dark';
          if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
