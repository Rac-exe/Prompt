<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Tailwind + Inter setup -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #1a1a1a;
    }
  </style>
</head>
<body class="w-full h-full flex items-center justify-center bg-transparent">
  <div class="w-[400px] rounded-[20px] bg-[#FEF0FA] p-[32px] flex flex-col gap-4 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.08)]">
      <!-- Mini input bar inside card -->
      <div class="flex h-[42px] w-full items-center rounded-[100px] bg-white/60 border border-[#E5E7EB] px-[2px]">
        <div class="ml-[10px] w-[28px] h-[28px]">
          <img src="../../images.jpg" alt="Star" class="w-full h-full">
        </div>
        <span class="flex-1 px-3 text-[14px] font-semibold text-[#6B7280] opacity-60">
          happy prompting...
        </span>
        <div class="mr-[10px] flex gap-1">
          <!-- Mic icon from Lucide -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#6B7280]">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <!-- LayoutDashboard icon from Lucide -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#6B7280]">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
      </div>

      <!-- Status -->
      <div id="status-text" class="text-[14px] text-[#6B7280]">
        Optimizing...
      </div>

      <!-- Optimized text -->
      <p
        id="optimized"
        class="text-[14px] leading-relaxed text-[#111827] whitespace-pre-wrap"
      ></p>

      <!-- Actions -->
      <div class="flex justify-end gap-[12px] mt-2">
        <button
          id="try-again-btn"
          type="button"
          class="w-[64px] h-[42px] flex items-center justify-center rounded-[12px] bg-[#CB91C2] hover:opacity-90 transition shadow-sm"
          title="Refresh optimization"
        >
          <!-- RefreshCcw icon from Lucide -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
        </button>

        <button
          id="copy-btn"
          type="button"
          class="w-[64px] h-[42px] flex items-center justify-center rounded-[12px] bg-[#CB91C2] hover:opacity-90 transition shadow-sm"
          title="Copy to clipboard"
        >
          <!-- Copy icon from Lucide -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>

        <button
          id="replace-btn"
          type="button"
          class="w-[64px] h-[42px] flex items-center justify-center rounded-[12px] bg-[#9B51E0] hover:opacity-90 transition shadow-sm"
          title="Replace original text"
        >
          <!-- Check icon from Lucide -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const original = params.get("original") || "";
    const optimized = params.get("optimized") || "";

    const optimizedEl = document.getElementById("optimized");
    const statusEl = document.getElementById("status-text");
    const inputEl = document.getElementById("prompt-input");

    if (inputEl && original) {
      inputEl.value = original;
    }

    if (optimized) {
      optimizedEl.textContent = optimized;
      statusEl.textContent = "Optimized prompt";
    } else {
      optimizedEl.textContent = original;
    }

    // ESC key to dismiss popup (Grammarly pattern)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.electronAPI && window.electronAPI.dismiss) {
          window.electronAPI.dismiss();
        }
      }
    });

    // Copy button - copies to clipboard using IPC (works without focus)
    document.getElementById("copy-btn").addEventListener("click", () => {
      const textToUse = optimized || original;
      if (textToUse) {
        if (window.electronAPI && window.electronAPI.copyToClipboard) {
          // Use IPC to copy (works even when window not focused)
          window.electronAPI.copyToClipboard(textToUse);
          // Show brief feedback
          const copyBtn = document.getElementById("copy-btn");
          copyBtn.style.backgroundColor = "#10B981";
          // Close popup after short delay so user sees the feedback
          setTimeout(() => {
            if (window.electronAPI) {
              window.electronAPI.dismiss();
            }
          }, 300);
        } else {
          // Fallback to navigator.clipboard (requires focus)
          navigator.clipboard.writeText(textToUse).then(() => {
            const copyBtn = document.getElementById("copy-btn");
            copyBtn.style.backgroundColor = "#10B981";
            // Close popup after short delay
            setTimeout(() => {
              if (window.electronAPI) {
                window.electronAPI.dismiss();
              }
            }, 300);
          }).catch(err => {
            console.error("Failed to copy:", err);
            alert("Failed to copy to clipboard");
          });
        }
      }
    });

    // Replace button - replaces original text with optimized text
    document.getElementById("replace-btn").addEventListener("click", () => {
      const textToUse = optimized || original;
      if (window.electronAPI && textToUse) {
        window.electronAPI.replaceTextInPlace(original, textToUse);
        // Show brief feedback before closing
        const replaceBtn = document.getElementById("replace-btn");
        replaceBtn.style.backgroundColor = "#10B981";
        setTimeout(() => {
          if (window.electronAPI) {
            window.electronAPI.dismiss();
          }
        }, 500);
      } else if (textToUse) {
        alert("Text replacement not available. Copying to clipboard instead.");
        navigator.clipboard.writeText(textToUse);
      }
    });

    document.getElementById("try-again-btn").addEventListener("click", () => {
      // Trigger re-optimization with the original prompt text
      if (window.electronAPI && window.electronAPI.reOptimize) {
        // Show loading state
        const tryAgainBtn = document.getElementById("try-again-btn");
        tryAgainBtn.style.backgroundColor = "#9B51E0";
        statusEl.textContent = "Re-optimizing...";
        optimizedEl.textContent = "Generating new optimization...";

        // Request re-optimization
        window.electronAPI.reOptimize(original);

        // Note: The popup will be dismissed and a new one will appear with fresh optimization
      } else if (window.electronAPI) {
        window.electronAPI.dismiss();
      }
    });
  </script>
</body>
</html>
