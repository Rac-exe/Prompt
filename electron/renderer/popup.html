<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }
    
    .header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .original {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: #666;
      border-left: 3px solid #ccc;
      margin-bottom: 12px;
      word-wrap: break-word;
    }
    
    .optimized {
      background: #f0f9ff;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
      color: #1a1a1a;
      border-left: 3px solid #64C8FF;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .button {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .button-primary {
      background: #007AFF;
      color: white;
    }
    
    .button-primary:hover {
      background: #0056CC;
    }
    
    .button-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .button-secondary:hover {
      background: #e0e0e0;
    }
    
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    
    .close-btn:hover {
      background: #f0f0f0;
      color: #333;
    }
  </style>
</head>
<body>
  <button class="close-btn" id="close-btn">×</button>
  
  <div class="header">Optimized Prompt</div>
  
  <div class="section">
    <div class="section-label">Original</div>
    <div class="original" id="original"></div>
  </div>
  
  <div class="section">
    <div class="section-label">Optimized</div>
    <div class="optimized" id="optimized"></div>
  </div>
  
  <div class="buttons">
    <button class="button button-primary" id="replace-btn">Replace</button>
    <button class="button button-secondary" id="dismiss-btn">Dismiss</button>
  </div>
  
  <script>
    const params = new URLSearchParams(window.location.search);
    const original = params.get("original") || "";
    const optimized = params.get("optimized") || "";
    
    document.getElementById("original").textContent = original;
    document.getElementById("optimized").textContent = optimized;
    
    document.getElementById("replace-btn").addEventListener("click", () => {
      if (window.electronAPI) {
        window.electronAPI.replaceText(optimized);
      } else {
        // Fallback: copy to clipboard
        navigator.clipboard.writeText(optimized).then(() => {
          alert("Optimized text copied to clipboard! Press Ctrl+V (Cmd+V on Mac) to paste.");
        });
      }
    });
    
    document.getElementById("dismiss-btn").addEventListener("click", () => {
      if (window.electronAPI) {
        window.electronAPI.dismiss();
      }
    });
    
    document.getElementById("close-btn").addEventListener("click", () => {
      if (window.electronAPI) {
        window.electronAPI.dismiss();
      }
    });
  </script>
</body>
</html>
