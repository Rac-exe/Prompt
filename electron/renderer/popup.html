<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; }
    /* Hide scrollbar for Chrome/Safari/Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full bg-transparent overflow-hidden">
  <div id="popup-container" class="w-full h-full bg-zinc-950 border border-zinc-800 rounded-xl flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Header / Drag Handle -->
      <div class="flex items-center justify-between px-4 py-3 bg-zinc-900/50 border-b border-zinc-800 cursor-move" id="drag-handle">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></div>
          <span class="text-xs font-medium text-zinc-400">Prompt Optimizer</span>
        </div>
        <div id="status-text" class="text-xs text-zinc-500">Ready</div>
      </div>

      <!-- Content Area -->
      <div class="flex-1 overflow-y-auto p-4 no-scrollbar">
        <div class="prose prose-invert prose-sm max-w-none">
          <p id="optimized" class="text-zinc-100 whitespace-pre-wrap leading-relaxed">Waiting for prompt...</p>
        </div>
      </div>

      <!-- Footer / Actions -->
      <div class="p-3 bg-zinc-900/50 border-t border-zinc-800 flex justify-end gap-2">
        
        <!-- Refresh -->
        <button id="try-again-btn" class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-colors" title="Regenerate">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16l5 0l0 5"/></svg>
        </button>

        <!-- Copy -->
        <button id="copy-btn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-zinc-300 bg-zinc-800 hover:bg-zinc-700 hover:text-white rounded-lg transition-colors border border-zinc-700" title="Copy to clipboard">
          <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy
        </button>

        <!-- Replace -->
        <button id="replace-btn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-white bg-purple-600 hover:bg-purple-500 rounded-lg transition-colors shadow-lg shadow-purple-900/20" title="Replace text">
          <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Replace
        </button>
      </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const original = params.get("original") || "";
    const optimized = params.get("optimized") || "";
    
    // Elements
    const elements = {
      optimized: document.getElementById("optimized"),
      status: document.getElementById("status-text"),
      btns: {
        refresh: document.getElementById("try-again-btn"),
        copy: document.getElementById("copy-btn"),
        replace: document.getElementById("replace-btn")
      },
      container: document.getElementById("popup-container")
    };

    // State
    const state = {
      contextKey: null
    };

    // Init Logic
    if (optimized) {
      elements.optimized.textContent = optimized;
      elements.status.textContent = "Complete";
    } else {
      elements.optimized.textContent = "Optimizing...";
    }

    // Set Context Key
    if (window.electronAPI) {
        window.electronAPI.onSetContextKey((key) => {
            state.contextKey = key;
            // Store global reference for drag code (legacy support)
            window.__contextKey = key; 
        });
        
        window.electronAPI.onOptimizationChunk((data) => {
             elements.optimized.textContent = data.accumulated;
             elements.status.textContent = "Generating...";
        });

        window.electronAPI.onOptimizationComplete((data) => {
             elements.optimized.textContent = data.optimized;
             elements.status.textContent = "Done";
        });
        
        window.electronAPI.onOptimizationError((data) => {
             elements.optimized.textContent = "Error: " + data.error;
             elements.status.textContent = "Error";
             elements.status.classList.add("text-red-500");
        });
    }

    // --- Actions ---

    // DRAG
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    const dragHandle = document.getElementById('drag-handle');
    
    dragHandle.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        
        if (window.electronAPI && state.contextKey) {
            window.electronAPI.send('popup:drag-start', {
                contextKey: state.contextKey,
                x: dragStartX,
                y: dragStartY
            });
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        if (window.electronAPI && state.contextKey) {
            window.electronAPI.send('popup:drag-move', {
                contextKey: state.contextKey,
                x: e.clientX,
                y: e.clientY
            });
        }
    });

    document.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (window.electronAPI && state.contextKey) {
            window.electronAPI.send('popup:drag-end', {
                contextKey: state.contextKey,
                x: e.clientX,
                y: e.clientY
            });
        }
    });

    // BUTTONS
    elements.btns.copy.addEventListener('click', () => {
        const text = elements.optimized.textContent;
        if (window.electronAPI) {
            window.electronAPI.copyToClipboard(text);
            const originalText = elements.btns.copy.innerHTML;
            elements.btns.copy.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17 4 12"/></svg> Copied`;
            setTimeout(() => elements.btns.copy.innerHTML = originalText, 1500);
        }
    });

    elements.btns.replace.addEventListener('click', () => {
        const text = elements.optimized.textContent;
        if (window.electronAPI && state.contextKey) {
             window.electronAPI.replaceTextInPlace(original, text);
        }
    });

    elements.btns.refresh.addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.reOptimize) {
             elements.status.textContent = "Regenerating...";
             elements.optimized.textContent = "";
             window.electronAPI.reOptimize(original);
        }
    });

    // CLOSE ON ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (window.electronAPI) window.electronAPI.dismiss();
        }
    });

  </script>
</body>
</html>
