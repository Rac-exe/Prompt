<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prmpt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Link the shared Design System CSS -->
  <link rel="stylesheet" href="design-system.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            emerald: {
              DEFAULT: "hsl(var(--emerald))",
              soft: "hsl(var(--emerald-soft))",
            }
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
        },
      },
      plugins: [],
    };
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      color: hsl(var(--foreground));
    }

    /* Loading spinner animation */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    /* State visibility */
    .state-container {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .state-container.active {
      opacity: 1;
      visibility: visible;
    }

    /* Sparkle animation for logo */
    @keyframes sparkle-rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sparkle-icon {
      animation: sparkle-rotate 20s linear infinite;
    }

    /* Thinking dots animation */
    @keyframes thinking-dots {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60%,
      100% {
        content: '...';
      }
    }

    .thinking-dots::after {
      content: '.';
      animation: thinking-dots 1.5s infinite;
    }

    /* Custom scrollbar - ChatGPT inspired */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: hsl(var(--muted));
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--muted-foreground) / 0.6);
      background-clip: padding-box;
    }

    /* Thin scrollbar that appears on hover */
    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: hsl(var(--muted)) transparent;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 0;
      transition: width 0.2s;
    }

    .custom-scroll:hover::-webkit-scrollbar {
      width: 8px;
    }

    /* Smooth height transitions */
    .expand-section {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }

    .expand-section.expanded {
      max-height: 2000px;
    }
  </style>
</head>

<body>
  <!-- ============================================ -->
  <!-- COLLAPSED STATE: Floating Logo (64px × 64px) -->
  <!-- ============================================ -->
  <div id="collapsed-state" class="state-container active" style="width: 64px; height: 64px;">
    <div id="collapsed-drag-handle" class="w-full h-full flex items-center justify-center cursor-move">
      <!-- Logo button -->
      <!-- Updated gradient to Emerald to match Premium Emerald theme -->
      <button id="logo-button"
        class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 flex items-center justify-center transition-all hover:scale-110 group relative border border-emerald-500/20"
        style="-webkit-app-region: no-drag; box-shadow: 0 0 20px hsl(var(--emerald) / 0.4);">
        <!-- Sparkle icon -->
        <svg class="w-6 h-6 text-white sparkle-icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
        </svg>
        <!-- Glow effect on hover -->
        <div
          class="absolute inset-0 rounded-full bg-emerald-400 opacity-0 group-hover:opacity-30 blur-lg transition-opacity">
        </div>
      </button>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- EXPANDED STATE: Single Panel (560px × variable) -->
  <!-- ============================================ -->
  <div id="expanded-state" class="state-container" style="width: 560px; min-height: 240px;">
    <!-- Replaced hardcoded black with bg-background and border-border -->
    <div class="w-full h-full flex flex-col bg-background rounded-3xl shadow-2xl border border-border">

      <!-- Header -->
      <div id="expanded-drag-handle"
        class="flex items-center justify-between px-6 py-3 border-b border-border cursor-move">
        <div class="flex items-center gap-3">
          <!-- Small orb in header - also updated to Emerald -->
          <div
            class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-[0_0_10px_hsl(var(--emerald)/0.3)]">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
            </svg>
          </div>
          <!-- Renamed to Prmpt -->
          <h2 class="text-foreground text-sm font-semibold tracking-wide">Prmpt</h2>
        </div>
        <button id="close-button"
          class="w-7 h-7 rounded-full hover:bg-white/10 flex items-center justify-center transition-colors"
          style="-webkit-app-region: no-drag;">
          <svg class="w-4 h-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Content - Scrollable container -->
      <div id="main-scroll-container" class="flex-1 flex flex-col overflow-y-auto custom-scroll">
        <div class="px-6 py-3 space-y-3">

          <!-- YOUR PROMPT Section -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-[10px] font-medium text-muted-foreground uppercase tracking-wider">Your Prompt</label>
              <div class="flex items-center gap-2">
                <!-- Mic button -->
                <button id="mic-button" class="p-1 rounded-lg hover:bg-white/10 transition-colors" title="Voice Input"
                  style="-webkit-app-region: no-drag;">
                  <svg id="mic-icon" class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                  </svg>
                </button>
                <!-- Copy button -->
                <button id="copy-input-btn" class="p-1 rounded-lg hover:bg-white/10 transition-colors" title="Copy"
                  style="-webkit-app-region: no-drag;">
                  <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Input area - Removed hardcoded dark grey, used bg-card/bg-surface -->
            <div class="bg-card rounded-xl border border-border p-3">
              <textarea id="prompt-textarea" placeholder="happy prompting..."
                class="w-full bg-transparent text-foreground text-sm outline-none placeholder-muted-foreground resize-none custom-scroll"
                style="min-height: 50px; max-height: 120px;"></textarea>
            </div>

            <!-- Generate actions -->
            <div class="flex items-center gap-2 mt-2">
              <!-- Generate button: Use bg-primary text-primary-foreground -->
              <button id="generate-button"
                class="flex-1 h-10 bg-primary hover:bg-emerald-600 text-primary-foreground text-sm font-semibold rounded-xl flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_15px_hsl(var(--emerald)/0.3)] hover:shadow-[0_0_20px_hsl(var(--emerald)/0.5)]"
                style="-webkit-app-region: no-drag;">
                <svg id="generate-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
                </svg>
                <svg id="generate-spinner" class="w-4 h-4 hidden animate-spin" xmlns="http://www.w3.org/2000/svg"
                  fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
                <span id="generate-text">GENERATE</span>
              </button>

              <!-- Regenerate button (Initially hidden) -->
              <!-- Use card background and border -->
              <button id="regenerate-icon-btn"
                class="hidden w-12 h-10 bg-card border border-border hover:bg-white/5 text-foreground rounded-xl flex items-center justify-center transition-all disabled:opacity-50"
                title="Regenerate Original" style="-webkit-app-region: no-drag;">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
            </div>
          </div>

          <!-- OPTIMIZED PROMPT Section (hidden initially, expands smoothly) -->
          <div id="optimized-section" class="expand-section">
            <div class="pt-3 border-t border-border">
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                  <label class="text-[10px] font-medium text-muted-foreground uppercase tracking-wider">Optimized
                    Prompt</label>
                  <!-- Status indicator -->
                  <div id="status-indicator"
                    class="flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-white/5 border border-white/5">
                    <div class="w-1.5 h-1.5 rounded-full bg-gray-500"></div>
                    <span class="text-[9px] text-muted-foreground font-medium">Waiting</span>
                  </div>
                </div>
                <button id="copy-optimized-btn" class="p-1 rounded-lg hover:bg-white/10 transition-colors" title="Copy"
                  style="-webkit-app-region: no-drag;">
                  <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
              </div>

              <!-- Optimized text display -->
              <!-- Use bg-card -->
              <div id="optimized-text-container" class="bg-card rounded-xl border border-border p-3 custom-scroll"
                style="max-height: 300px; min-height: 60px; overflow-y: auto; overflow-x: hidden;">
                <p id="optimized-text" class="text-sm text-foreground leading-relaxed whitespace-pre-wrap break-words"
                  style="min-height: 1rem; will-change: contents;">
                  Click generate to optimize your prompt
                </p>
              </div>

              <!-- Action buttons -->
              <div class="flex items-center gap-2 mt-2">
                <!-- Copy button -->
                <button id="copy-button"
                  class="flex-1 h-10 bg-secondary hover:bg-secondary/80 text-secondary-foreground text-sm font-medium rounded-xl flex items-center justify-center gap-2 transition-colors border border-transparent"
                  style="-webkit-app-region: no-drag;">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                  <span>Copy</span>
                </button>

                <!-- Replace Original button -->
                <button id="replace-button"
                  class="flex-1 h-10 bg-primary hover:bg-emerald-600 text-primary-foreground text-sm font-semibold rounded-xl flex items-center justify-center gap-2 transition-all shadow-[0_0_15px_hsl(var(--emerald)/0.3)] hover:shadow-[0_0_20px_hsl(var(--emerald)/0.5)]"
                  style="-webkit-app-region: no-drag;">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                  </svg>
                  <span>REPLACE</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('[FloatingPanel v3] ===== SCRIPT STARTING =====');
    console.log('[FloatingPanel v3] electronAPI available:', !!window.electronAPI);
    console.log('[FloatingPanel v3] onOptimizationComplete available:', !!window.electronAPI?.onOptimizationComplete);

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let currentState = 'collapsed'; // collapsed | expanded
    let isListening = false;
    let isOptimizing = false;
    let originalPrompt = '';
    let optimizedPrompt = '';
    let typingAnimationId = null;
    let optimizationRequestId = 0; // To handle concurrent requests

    const collapsedState = document.getElementById('collapsed-state');
    const expandedState = document.getElementById('expanded-state');

    const logoButton = document.getElementById('logo-button');
    const closeButton = document.getElementById('close-button');
    const promptTextarea = document.getElementById('prompt-textarea');
    const generateButton = document.getElementById('generate-button');
    const regenerateIconBtn = document.getElementById('regenerate-icon-btn');
    const micButton = document.getElementById('mic-button');
    const micIcon = document.getElementById('mic-icon');

    const optimizedSection = document.getElementById('optimized-section');
    const optimizedText = document.getElementById('optimized-text');
    const statusIndicator = document.getElementById('status-indicator');
    // const retryButton = document.getElementById('retry-button'); // REMOVED
    const copyButton = document.getElementById('copy-button');
    const replaceButton = document.getElementById('replace-button');
    const copyInputBtn = document.getElementById('copy-input-btn');
    const copyOptimizedBtn = document.getElementById('copy-optimized-btn');

    // ==========================================
    // STATE TRANSITIONS
    // ==========================================
    function transitionToState(newState) {
      console.log('[State] Transitioning from', currentState, 'to', newState);

      // Hide all states
      collapsedState.classList.remove('active');
      expandedState.classList.remove('active');

      // Show new state and resize window
      if (newState === 'collapsed') {
        collapsedState.classList.add('active');
        if (window.electronAPI?.send) {
          window.electronAPI.send('floating-panel:resize-and-reposition', {
            width: 64,
            height: 64,
            fromState: currentState
          });
        }
      } else if (newState === 'expanded') {
        expandedState.classList.add('active');

        // CRITICAL: Always enable inputs when expanding
        // This ensures the panel is never stuck in a disabled state
        if (promptTextarea) promptTextarea.disabled = false;
        if (generateButton) generateButton.disabled = false;

        // Reset optimizing state if it was stuck
        if (isOptimizing) {
          console.warn('[State] Resetting stuck optimizing state');
          isOptimizing = false;
          setStatus('ready', 'Ready');
          setGenerateButtonState('idle');
        }

        // Calculate required height based on content
        const hasOptimized = optimizedSection.classList.contains('expanded');
        // Base height for input mode
        let targetHeight = 240;

        if (hasOptimized) {
          // If optimized, give it more space but cap it
          targetHeight = 650;
        }

        if (window.electronAPI?.send) {
          window.electronAPI.send('floating-panel:resize-and-reposition', {
            width: 560,
            height: targetHeight,
            fromState: currentState
          });
        }

        // Force focus textarea after transition (single attempt is usually sufficient)
        requestAnimationFrame(() => {
          setTimeout(() => {
            if (promptTextarea) {
              promptTextarea.focus();
              console.log('[State] Focused textarea after transition to expanded');

              // Force layout update/check for scrollbars
              const scrollContainer = document.getElementById('main-scroll-container');
              if (scrollContainer) {
                const currentScroll = scrollContainer.scrollTop;
                scrollContainer.scrollTop = currentScroll + 1;
                scrollContainer.scrollTop = currentScroll;
              }
            }
          }, 150);
        });
      }

      currentState = newState;
    }

    // ==========================================
    // SHOW/HIDE OPTIMIZED SECTION
    // ==========================================
    function showOptimizedSection() {
      optimizedSection.classList.add('expanded');

      // Use fixed height for stability
      if (window.electronAPI?.send) {
        window.electronAPI.send('floating-panel:resize-and-reposition', {
          width: 560,
          height: 650,
          fromState: currentState
        });
      }

      // Force scroll to bottom after transition
      setTimeout(() => {
        const scrollContainer = document.getElementById('main-scroll-container');
        if (scrollContainer) {
          scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }
      }, 350);
    }

    function hideOptimizedSection() {
      optimizedSection.classList.remove('expanded');
      // Reset to base size
      if (window.electronAPI?.send) {
        window.electronAPI.send('floating-panel:resize-and-reposition', {
          width: 560,
          height: 240,
          fromState: currentState
        });
      }
    }

    // ==========================================
    // STATUS INDICATOR
    // ==========================================
    function setStatus(status, label) {
      const dot = statusIndicator.querySelector('.w-1\\.5');
      const text = statusIndicator.querySelector('span');

      if (status === 'waiting') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-gray-500';
        text.textContent = label || 'Waiting';
        text.className = 'text-[9px] text-muted-foreground font-medium';
      } else if (status === 'optimizing') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-primary animate-pulse'; // Uses primary (Emerald)
        text.textContent = label || 'Optimizing';
        text.className = 'text-[9px] text-primary font-medium';
      } else if (status === 'ready') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-primary'; // Uses primary (Emerald)
        text.textContent = label || 'Ready';
        text.className = 'text-[9px] text-primary font-medium';
      }
    }

    // ==========================================
    // OPTIMIZE FUNCTION (INLINE - NO POPUP)
    // ==========================================
    async function optimizePrompt(userPrompt, isRegenerate = false) {
      if (!userPrompt || userPrompt.trim().length === 0) {
        console.warn('[Optimize] Empty prompt');
        return;
      }

      // Prevent concurrent optimizations
      if (isOptimizing) {
        console.warn('[Optimize] Already optimizing, ignoring request');
        return;
      }

      console.log('[Optimize] Starting optimization:', userPrompt);
      originalPrompt = userPrompt;
      isOptimizing = true;
      optimizationRequestId++; // Increment request ID
      const currentRequestId = optimizationRequestId;

      // Cancel any ongoing typing animation
      if (typingAnimationId) {
        cancelAnimationFrame(typingAnimationId);
        typingAnimationId = null;
      }

      // Show optimized section INLINE (no popup)
      showOptimizedSection();

      // Update UI
      setStatus('optimizing', isRegenerate ? 'Regenerating' : 'Optimizing');
      generateButton.disabled = true;
      // retryButton.disabled = true; // REMOVED
      promptTextarea.disabled = true;

      // Show "thinking" state IN THE OPTIMIZED TEXT AREA
      optimizedText.innerHTML = '<span class="thinking-dots">Optimizing</span>';

      try {
        // Send to main process for optimization
        if (window.electronAPI?.send) {
          window.electronAPI.send('floating-panel:prompt-submit', isRegenerate ? { text: userPrompt, isRegenerate: true } : userPrompt);
        }

      } catch (error) {
        console.error('[Optimize] Error:', error);
        // Only update if this is still the current request
        if (currentRequestId === optimizationRequestId) {
          optimizedText.textContent = 'Failed to optimize prompt. Please try again.';
          setStatus('waiting', 'Error');
          isOptimizing = false;
          generateButton.disabled = false;
          // retryButton.disabled = false; // REMOVED
          promptTextarea.disabled = false;
        }
      }
    }

    // ==========================================
    // TYPING ANIMATION (IN THE OPTIMIZED SECTION)
    // ==========================================
    function typeText(element, text, speed = 15) {
      return new Promise((resolve) => {
        // Cancel any existing animation
        if (typingAnimationId) {
          cancelAnimationFrame(typingAnimationId);
        }

        // Ensure text is valid
        if (!text || typeof text !== 'string') {
          element.textContent = text || '';
          resolve();
          return;
        }

        element.textContent = '';
        let index = 0;
        const totalChars = text.length;
        const charsPerFrame = Math.max(1, Math.ceil(totalChars / 60)); // Complete in ~60 frames

        function animate() {
          const endIndex = Math.min(index + charsPerFrame, totalChars);
          element.textContent = text.substring(0, endIndex);
          index = endIndex;

          if (index < totalChars) {
            typingAnimationId = requestAnimationFrame(animate);
          } else {
            typingAnimationId = null;
            resolve();
          }
        }

        typingAnimationId = requestAnimationFrame(animate);
      });
    }

    // ==========================================
    // EVENT HANDLERS
    // ==========================================

    // Logo button - toggle between collapsed and expanded
    logoButton.addEventListener('click', () => {
      if (currentState === 'collapsed') {
        transitionToState('expanded');
      } else {
        transitionToState('collapsed');
      }
    });

    // Also make the orb in the header clickable to collapse
    const headerOrb = document.querySelector('#expanded-state .w-8.h-8.rounded-full');
    if (headerOrb) {
      headerOrb.classList.add('cursor-pointer', 'hover:scale-110', 'transition-transform');
      headerOrb.addEventListener('click', () => {
        hideOptimizedSection();
        transitionToState('collapsed');
      });
    }

    // Close button - also collapses
    closeButton.addEventListener('click', () => {
      hideOptimizedSection();
      transitionToState('collapsed');
    });

    // DOM references for button state management
    const generateIcon = document.getElementById('generate-icon');
    const generateSpinner = document.getElementById('generate-spinner');
    const generateText = document.getElementById('generate-text');
    let hasGeneratedOnce = false;

    // ==========================================
    // DRAG HANDLERS
    // ==========================================
    const collapsedHandle = document.getElementById('collapsed-drag-handle');
    const expandedHandle = document.getElementById('expanded-drag-handle');

    function setupDrag(element) {
      if (!element) return;

      element.addEventListener('mousedown', (e) => {
        // Ignore if clicking a button inside the handle
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

        if (e.button === 0) { // Left click only
          if (window.electronAPI?.send) {
            window.electronAPI.send('floating-panel:drag-start');
          }
        }
      });
    }

    setupDrag(collapsedHandle);
    setupDrag(expandedHandle);

    window.addEventListener('mouseup', () => {
      if (window.electronAPI?.send) {
        window.electronAPI.send('floating-panel:drag-end');
      }
    });

    // Update generate button state
    function setGenerateButtonState(state) {
      switch (state) {
        case 'loading':
          generateIcon.classList.add('hidden');
          generateSpinner.classList.remove('hidden');
          generateText.textContent = 'GENERATING...';
          // Disable separate regenerate button while loading
          if (regenerateIconBtn) regenerateIconBtn.disabled = true;
          break;
        case 'idle':
          generateIcon.classList.remove('hidden');
          generateSpinner.classList.add('hidden');
          // Always keep text as GENERATE
          generateText.textContent = 'GENERATE';

          // Show regenerate button if we have generated once
          if (hasGeneratedOnce && regenerateIconBtn) {
            regenerateIconBtn.classList.remove('hidden');
            regenerateIconBtn.disabled = false;
            // The generate button is already forced to flex-1, so it will shrink slightly
            // but we can animate width if needed. Flex layout handles it cleanly.
          }
          break;
      }
    }

    // Generate button
    generateButton.addEventListener('click', () => {
      const prompt = promptTextarea.value.trim();
      if (prompt && !isOptimizing) {
        setGenerateButtonState('loading');
        optimizePrompt(prompt);
      }
    });

    // Enter key in textarea
    promptTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const prompt = promptTextarea.value.trim();
        if (prompt && !isOptimizing) {
          setGenerateButtonState('loading');
          optimizePrompt(prompt);
        }
      }
    });

    // Retry button (Regenerate) - The one in the optimized section
    // retryButton listener removed as button is deleted
    // retryButton.addEventListener('click', () => {
    //   if (originalPrompt && !isOptimizing) {
    //     setGenerateButtonState('loading');
    //     optimizePrompt(originalPrompt, true);
    //   }
    // });

    // New Separate Regenerate Icon Button (next to Generate)
    if (regenerateIconBtn) {
      regenerateIconBtn.addEventListener('click', () => {
        if (originalPrompt && !isOptimizing) {
          setGenerateButtonState('loading');
          optimizePrompt(originalPrompt, true);
        }
      });
    }

    // Helper for visual feedback
    function showCopyFeedback(button) {
      const originalContent = button.innerHTML;
      const isIconOnly = !button.querySelector('span');

      if (isIconOnly) {
        button.innerHTML = `
          <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
        `;
      } else {
        const span = button.querySelector('span');
        const originalText = span.textContent;
        span.textContent = 'Copied!';
        button.classList.add('bg-green-900/30', 'text-green-400');
        button.classList.remove('bg-gray-800', 'hover:bg-gray-700'); // removed specific utility class
        if (button.classList.contains('bg-secondary')) {
          button.classList.remove('bg-secondary');
          button.classList.add('bg-emerald-900/50', 'text-emerald-400');
        }
      }

      setTimeout(() => {
        button.innerHTML = originalContent;
        if (!isIconOnly) {
          if (button.classList.contains('bg-emerald-900/50')) {
            button.classList.remove('bg-emerald-900/50', 'text-emerald-400');
            button.classList.add('bg-secondary');
          }
        }
      }, 2000);
    }

    // Copy buttons
    copyInputBtn.addEventListener('click', () => {
      const text = promptTextarea.value;
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          console.log('[Copy] Input copied');
          showCopyFeedback(copyInputBtn);
        });
      }
    });

    copyOptimizedBtn.addEventListener('click', () => {
      if (optimizedPrompt) {
        navigator.clipboard.writeText(optimizedPrompt).then(() => {
          console.log('[Copy] Optimized text copied');
          showCopyFeedback(copyOptimizedBtn);
        });
      }
    });

    copyButton.addEventListener('click', () => {
      if (optimizedPrompt) {
        navigator.clipboard.writeText(optimizedPrompt).then(() => {
          console.log('[Copy] Optimized text copied');
          showCopyFeedback(copyButton);
        });
      }
    });

    // Replace button
    replaceButton.addEventListener('click', () => {
      if (optimizedPrompt && window.electronAPI?.send) {
        console.log('[Replace] Sending replace request');
        window.electronAPI.send('floating-panel:replace-text', {
          optimizedText: optimizedPrompt
        });
      }
    });

    // Mic button
    micButton.addEventListener('click', () => {
      if (!isListening) {
        startListening();
      } else {
        stopListening();
      }
    });

    function startListening() {
      isListening = true;
      micButton.classList.add('bg-destructive', 'text-destructive-foreground');
      micButton.classList.remove('hover:bg-white/10');

      if (window.electronAPI?.startTranscription) {
        window.electronAPI.startTranscription();
      }
    }

    function stopListening() {
      isListening = false;
      micButton.classList.remove('bg-destructive', 'text-destructive-foreground');
      micButton.classList.add('hover:bg-white/10');

      if (window.electronAPI?.stopTranscription) {
        window.electronAPI.stopTranscription();
      }
    }

    // ==========================================
    // ELECTRON IPC LISTENERS
    // ==========================================

    // Listen for expand-to-input event
    if (window.electronAPI?.onExpandToInput) {
      window.electronAPI.onExpandToInput(() => {
        console.log('[IPC] Received expand-to-input event');
        transitionToState('expanded');

        // CRITICAL FIX: Force enable input and reset state
        // This ensures that if the panel was closed while disabled, it re-enables
        promptTextarea.disabled = false;
        generateButton.disabled = false;

        // We don't necessarily want to clear the prompt if they are coming back to it?
        // User workflow: open -> type -> close -> open again -> should see text?
        // Current logic: promptTextarea.value = ''; (lines 853)
        // If we want to clear it:
        promptTextarea.value = '';

        // Reset optimizing state just in case
        if (isOptimizing) {
          isOptimizing = false;
          setStatus('ready', 'Ready');
          setGenerateButtonState('idle');
        }

        hideOptimizedSection();

        // Force focus on textarea after transition
        requestAnimationFrame(() => {
          setTimeout(() => {
            promptTextarea.focus();
            console.log('[IPC] Focused textarea after expand-to-input');
          }, 150);
        });
      });
    }

    // Listen for set-prompt-text event (e.g. from overlay)
    // Listen for set-prompt-text event
    if (window.electronAPI?.onSetPromptText) {
      window.electronAPI.onSetPromptText((text) => {
        console.log('[IPC] Received set-prompt-text event');
        if (text) {
          promptTextarea.value = text;
          // Auto-expand and start optimizing if text is provided
          transitionToState('expanded');
          optimizePrompt(text);
        }
      });
    }

    // Listen for optimization complete
    if (window.electronAPI?.onOptimizationComplete) {
      window.electronAPI.onOptimizationComplete((data) => {
        console.log('[IPC] Received optimization-complete event');

        // Only process if we are currently optimizing
        if (!isOptimizing) return;

        isOptimizing = false;
        hasGeneratedOnce = true;
        setGenerateButtonState('idle'); // Generate button goes back to idle or shows regenerate
        retryButton.disabled = false;
        promptTextarea.disabled = false;

        // Ensure buttons are enabled
        generateButton.disabled = false;

        if (data.error) {
          optimizedText.textContent = 'Error: ' + data.error;
          setStatus('waiting', 'Error');
          return;
        }

        // FIX: The main process returns 'optimized', not 'optimizedText'
        optimizedPrompt = data.optimized || data.optimizedText;
        setStatus('ready', 'Optimized');

        // Streaming handles the display, so we just ensure the final text is correct
        // and remove any typing animation which would look weird after streaming
        optimizedText.textContent = optimizedPrompt;

        // Auto-scroll to bottom one last time
        const scrollContainer = document.getElementById('optimized-text-container');
        if (scrollContainer) {
          scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }
      });
    }

    // Listen for streaming updates
    if (window.electronAPI?.onTranscriptionUpdate) {
      window.electronAPI.onTranscriptionUpdate((data) => {
        // ... existing code ...
      });
    }

    // LISTENER FOR OPTIMIZATION CHUNKS (STREAMING)
    if (window.electronAPI?.onOptimizationChunk) {
      window.electronAPI.onOptimizationChunk((data) => {
        // console.log('[IPC] Received chunk:', data.chunk);

        // Ensure we are in optimizing state
        if (!isOptimizing) return;

        // On first chunk, clear the "Thinking..." text if it's there
        const currentText = optimizedText.innerHTML;
        if (currentText.includes('thinking-dots') || currentText === '') {
          optimizedText.innerHTML = ''; // Clear properly
          optimizedText.textContent = '';
        }

        // Append chunk
        // Use textContent to avoid HTML injection, but appended
        optimizedText.textContent += data.chunk;

        // Auto-scroll to bottom
        const scrollContainer = document.getElementById('optimized-text-container');
        if (scrollContainer) {
          scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }
      });
    }

    // ==========================================
    // CLICK-THROUGH MANAGEMENT (CRITICAL FIX)
    // ==========================================
    // These listeners ensure the window captures mouse events when hovered,
    // and lets them pass through when not hovered.
    document.body.addEventListener('mouseenter', () => {
      console.log('[Mouse] Enter body - enabling clicks');
      if (window.electronAPI?.send) {
        window.electronAPI.send('floating-panel:set-clickable', true);
      }
    });

    document.body.addEventListener('mouseleave', () => {
      console.log('[Mouse] Leave body - disabling clicks');
      if (window.electronAPI?.send) {
        window.electronAPI.send('floating-panel:set-clickable', false);
      }
    });

    // Initial log
    console.log('[FloatingPanel v3] Script loaded');
  </script>
</body>

</html>
