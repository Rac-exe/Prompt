<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prmpt Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      overflow: hidden;
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ======== PANEL SHELL ======== */
    .overlay-panel {
      width: 480px;
      border-radius: 20px;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      box-shadow:
        0 0 0 1px hsl(var(--border) / 0.5),
        0 8px 40px -8px rgba(0, 0, 0, 0.55),
        0 30px 60px -15px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 hsl(0 0% 100% / 0.03);
      overflow: hidden;
      position: relative;
    }

    /* Subtle top-edge accent line */
    .overlay-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, hsl(var(--emerald) / 0.5), transparent);
      z-index: 10;
    }

    /* ======== SCROLLBAR ======== */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: hsl(var(--muted-foreground) / 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--muted-foreground) / 0.35);
    }

    /* ======== VIEW TRANSITIONS ======== */
    .view {
      display: none;
    }

    .view.active {
      display: flex;
    }

    /* ======== ANIMATIONS ======== */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .animate-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes thinking {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60%,
      100% {
        content: '...';
      }
    }

    .thinking-dots::after {
      content: '.';
      animation: thinking 1.4s infinite;
    }

    @keyframes fade-slide-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel-enter {
      animation: fade-slide-in 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    @keyframes mic-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 hsl(0 72% 51% / 0.4);
      }

      50% {
        box-shadow: 0 0 0 6px hsl(0 72% 51% / 0);
      }
    }

    /* ======== RESULT EXPAND ======== */
    .result-section {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .result-section.visible {
      max-height: 600px;
      opacity: 1;
    }

    /* ======== TEXTAREA ======== */
    textarea {
      field-sizing: content;
      min-height: 72px;
      max-height: 150px;
    }

    /* ======== FLASH ANIMATION ======== */
    @keyframes flash-success {
      0% {
        background-color: hsl(var(--emerald) / 0.15);
      }

      100% {
        background-color: transparent;
      }
    }

    .flash-success {
      animation: flash-success 1.5s ease-out;
    }

    /* ======== BUTTON STYLES ======== */
    .btn-primary {
      background: linear-gradient(135deg, hsl(var(--emerald)), hsl(217 91% 50%));
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px hsl(var(--emerald) / 0.35);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: hsl(var(--secondary));
      color: hsl(var(--secondary-foreground));
      font-weight: 500;
      border: 1px solid hsl(var(--border));
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: hsl(var(--muted));
      border-color: hsl(var(--muted-foreground) / 0.2);
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      background: transparent;
      border: none;
      cursor: pointer;
      color: hsl(var(--muted-foreground));
      transition: all 0.15s ease;
    }

    .btn-ghost:hover {
      background: hsl(var(--muted));
      color: hsl(var(--foreground));
    }

    /* ======== REGENERATE ======== */
    .btn-regenerate {
      background: hsl(var(--card));
      border: 1.5px solid hsl(var(--emerald) / 0.4);
      color: hsl(var(--emerald));
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-regenerate:hover {
      background: hsl(var(--emerald) / 0.1);
      border-color: hsl(var(--emerald) / 0.7);
      box-shadow: 0 0 16px hsl(var(--emerald) / 0.15);
    }

    .btn-regenerate:active {
      transform: scale(0.97);
    }

    .btn-regenerate:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ======== VOICE BUTTON ======== */
    .btn-voice {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-voice:hover {
      background: hsl(var(--muted));
    }

    .btn-voice.listening {
      background: hsl(0 72% 51% / 0.08);
      border-color: hsl(0 72% 51% / 0.3);
      animation: mic-pulse 2s ease-in-out infinite;
    }

    /* ======== INPUT AREA ======== */
    .input-area {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-area:focus-within {
      border-color: hsl(var(--emerald) / 0.4);
      box-shadow: 0 0 0 3px hsl(var(--emerald) / 0.08);
    }

    /* ======== RESULT BOX ======== */
    .result-box {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 14px;
      position: relative;
    }

    .result-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, hsl(var(--emerald) / 0.2), transparent);
    }

    /* ======== STATUS PILL ======== */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .status-pill.optimizing {
      background: hsl(var(--emerald) / 0.1);
      color: hsl(var(--emerald));
    }

    .status-pill.ready {
      background: hsl(var(--emerald) / 0.1);
      color: hsl(var(--emerald));
    }

    .status-pill.error {
      background: hsl(0 72% 51% / 0.1);
      color: hsl(0 72% 51%);
    }

    .status-pill.waiting {
      background: hsl(var(--muted));
      color: hsl(var(--muted-foreground));
    }

    /* ======== DIVIDER ======== */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, hsl(var(--border)), transparent);
    }

    /* ======== COLLECTION PICKER MODAL ======== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: 360px;
      max-height: 400px;
      border-radius: 16px;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fade-slide-in 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .collection-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .collection-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
      font-size: 13px;
      color: hsl(var(--foreground));
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .collection-item:hover {
      background: hsl(var(--muted));
    }

    .collection-item.selected {
      background: hsl(var(--emerald) / 0.08);
      border-color: hsl(var(--emerald) / 0.4);
    }

    .collection-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .new-collection-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 10px;
    }

    .new-collection-input {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .new-collection-input:focus {
      border-color: hsl(var(--emerald) / 0.5);
    }

    .new-collection-input::placeholder {
      color: hsl(var(--muted-foreground));
    }

    .btn-add-collection {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      background: hsl(var(--secondary));
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground));
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-add-collection:hover {
      background: hsl(var(--muted));
    }

    .btn-add-collection:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .modal-footer {
      padding: 10px 14px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ======== SAVED STATE ======== */
    .btn-saved {
      background: hsl(var(--emerald) / 0.15) !important;
      border: 1px solid hsl(var(--emerald) / 0.3) !important;
      color: hsl(var(--emerald)) !important;
      cursor: default !important;
      pointer-events: none;
    }

    /* ======== INSERT / REPLACE BUTTON ======== */
    .btn-insert {
      background: linear-gradient(135deg, hsl(221 83% 53%), hsl(250 80% 58%));
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .btn-insert:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 20px hsl(221 83% 53% / 0.4);
    }

    .btn-insert:active {
      transform: scale(0.97);
    }

    .btn-insert:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: none;
      box-shadow: none;
    }

    /* ======== AUTH VIEW ======== */
    .auth-icon-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, hsl(var(--muted)), hsl(var(--secondary)));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .auth-icon-ring::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, hsl(var(--emerald) / 0.3), transparent);
      z-index: -1;
    }
  </style>
</head>

<body>
  <div id="panel" class="panel-enter">
    <div class="overlay-panel">

      <!-- ===== HEADER ===== -->
      <div
        style="-webkit-app-region: drag; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- Logo -->
          <div
            style="width: 28px; height: 28px; border-radius: 10px; background: linear-gradient(135deg, hsl(var(--emerald)), hsl(217 91% 50%)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px hsl(var(--emerald) / 0.3);">
            <svg style="width: 14px; height: 14px; color: white;" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
            </svg>
          </div>
          <div>
            <span
              style="font-size: 13px; font-weight: 700; color: hsl(var(--foreground)); letter-spacing: -0.01em;">Prmpt</span>
            <span
              style="font-size: 10px; font-weight: 500; color: hsl(var(--muted-foreground)); margin-left: 6px; letter-spacing: 0.02em;">OVERLAY</span>
          </div>
        </div>
        <button id="btn-close" class="btn-ghost"
          style="-webkit-app-region: no-drag; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- ===== AUTH GATE VIEW ===== -->
      <div id="view-auth" class="view"
        style="flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; text-align: center; gap: 20px;">
        <div class="auth-icon-ring">
          <svg style="width: 28px; height: 28px; color: hsl(var(--muted-foreground));" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <div>
          <h3
            style="font-size: 17px; font-weight: 700; color: hsl(var(--foreground)); margin-bottom: 6px; letter-spacing: -0.02em;">
            Login Required</h3>
          <p
            style="font-size: 13px; color: hsl(var(--muted-foreground)); line-height: 1.5; max-width: 260px; margin: 0 auto;">
            Sign in to your account to use the prompt optimizer.
          </p>
        </div>
        <button id="btn-open-app" class="btn-primary"
          style="-webkit-app-region: no-drag; height: 40px; padding: 0 24px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
          Open App to Login
        </button>
      </div>

      <!-- ===== MAIN VIEW ===== -->
      <div id="view-main" class="view" style="flex-direction: column;">
        <div
          style="display: flex; flex-direction: column; padding: 16px 18px; gap: 14px; overflow-y: auto; max-height: 540px;">

          <!-- INPUT SECTION -->
          <div>
            <!-- Label row with voice button -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
              <span
                style="font-size: 11px; font-weight: 600; color: hsl(var(--muted-foreground)); letter-spacing: 0.05em; text-transform: uppercase;">
                Your Prompt
              </span>

              <div style="display: flex; align-items: center; gap: 8px;">
                <!-- Mode Toggle -->
                <div
                  style="-webkit-app-region: no-drag; display: flex; background: hsl(var(--secondary) / 0.3); border-radius: 8px; padding: 2px; border: 1px solid hsl(var(--border) / 0.4);">
                  <button id="btn-mode-fast"
                    style="padding: 4px 10px; font-size: 11px; font-weight: 500; border-radius: 6px; cursor: pointer; border: none; background: hsl(var(--emerald)); color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: all 0.2s;">Fast</button>
                  <button id="btn-mode-thinking"
                    style="padding: 4px 10px; font-size: 11px; font-weight: 500; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: hsl(var(--muted-foreground)); transition: all 0.2s;">Thinking</button>
                </div>

                <!-- Voice Button -->
                <button id="btn-voice" class="btn-voice" title="Voice Input"
                  style="-webkit-app-region: no-drag; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground));">
                  <svg id="icon-mic" style="width: 13px; height: 13px;" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                  </svg>
                  <svg id="icon-mic-listening" style="width: 13px; height: 13px; color: hsl(0 72% 51%); display: none;"
                    fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" />
                  </svg>
                  <span id="voice-status-text">Voice</span>
                </button>
              </div>
            </div>

            <!-- Textarea -->
            <div class="input-area" style="padding: 12px 14px;">
              <textarea id="prompt-input" placeholder="Describe what you need optimized..."
                style="-webkit-app-region: no-drag; width: 100%; background: transparent; color: hsl(var(--foreground)); font-size: 13px; line-height: 1.6; outline: none; resize: none; border: none; font-family: inherit;">
              </textarea>
            </div>

            <!-- Action Buttons -->
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
              <!-- Generate -->
              <button id="btn-generate" class="btn-primary"
                style="-webkit-app-region: no-drag; flex: 1; height: 42px; border-radius: 12px; font-size: 13px; letter-spacing: 0.03em; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg id="icon-generate" style="width: 15px; height: 15px;" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
                </svg>
                <svg id="icon-spinner" style="width: 15px; height: 15px; display: none;" fill="none" viewBox="0 0 24 24"
                  class="animate-spin">
                  <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
                  <path style="opacity: 0.8;" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                </svg>
                <span id="btn-generate-text">Optimize</span>
              </button>

              <!-- Regenerate -->
              <button id="btn-regenerate" class="btn-regenerate" title="Regenerate with different results"
                style="-webkit-app-region: no-drag; display: none; height: 42px; padding: 0 16px; border-radius: 12px; font-size: 12px; align-items: center; gap: 6px;">
                <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Redo</span>
              </button>
            </div>
          </div>

          <!-- RESULT SECTION (expands after optimization) -->
          <div id="result-section" class="result-section">
            <div class="divider" style="margin-bottom: 14px;"></div>

            <!-- Result header -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
              <span
                style="font-size: 11px; font-weight: 600; color: hsl(var(--muted-foreground)); letter-spacing: 0.05em; text-transform: uppercase;">
                Optimized Result
              </span>
              <div id="status-badge" class="status-pill waiting">
                <div id="status-dot" style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;">
                </div>
                <span id="status-text">Waiting</span>
              </div>
            </div>

            <!-- Result text -->
            <div id="result-container" class="result-box"
              style="padding: 14px 16px; overflow-y: auto; max-height: 200px; min-height: 48px;">
              <p id="result-text"
                style="font-size: 13px; color: hsl(var(--foreground)); line-height: 1.65; white-space: pre-wrap; word-break: break-word; min-height: 1em; margin: 0;">
              </p>
            </div>

            <!-- Action bar -->
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
              <button id="btn-copy" class="btn-secondary"
                style="-webkit-app-region: no-drag; flex: 1; height: 38px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
                <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span id="btn-copy-text">Copy</span>
              </button>

              <!-- Replace in original app -->
              <button id="btn-insert" class="btn-insert" title="Replace @prompt with optimized text in the original app"
                style="-webkit-app-region: no-drag; flex: 1; height: 38px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <svg id="icon-insert" style="width: 14px; height: 14px;" fill="none" stroke="currentColor"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                </svg>
                <span id="btn-insert-text">Replace</span>
              </button>

              <button id="btn-save" class="btn-primary"
                style="-webkit-app-region: no-drag; flex: 1; height: 38px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <svg id="icon-save" style="width: 14px; height: 14px;" fill="none" stroke="currentColor"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
                <span id="btn-save-text">Save to Library</span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- ===== COLLECTION PICKER MODAL ===== -->
    <div id="modal-backdrop" class="modal-backdrop">
      <div class="modal-panel">
        <div class="modal-header">
          <span style="font-size: 14px; font-weight: 700; color: hsl(var(--foreground)); letter-spacing: -0.01em;">Save
            to Collection</span>
          <button id="modal-close" class="btn-ghost"
            style="width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
            <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="divider" style="margin: 0 14px;"></div>

        <!-- Title Input -->
        <div style="padding: 12px 14px 4px;">
          <label
            style="font-size: 11px; font-weight: 600; color: hsl(var(--muted-foreground)); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin-bottom: 6px;">
            Title
          </label>
          <input id="save-title-input" class="new-collection-input" type="text"
            placeholder="Give your prompt a title..." maxlength="80" style="width: 100%; height: 38px;">
        </div>

        <!-- Collection List -->
        <div style="padding: 4px 14px 0;">
          <label
            style="font-size: 11px; font-weight: 600; color: hsl(var(--muted-foreground)); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin-bottom: 6px;">
            Collection
          </label>
        </div>
        <div id="collection-list" class="collection-list">
          <div style="padding: 24px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 12px;">
            Loading collections...
          </div>
        </div>

        <!-- New Collection Inline -->
        <div class="divider" style="margin: 2px 14px 0;"></div>
        <div class="new-collection-row">
          <input id="new-collection-input" class="new-collection-input" type="text" placeholder="New collection name..."
            maxlength="50">
          <button id="btn-add-collection" class="btn-add-collection" disabled>Create</button>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button id="modal-cancel" class="btn-secondary"
            style="flex: 1; height: 38px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center;">
            Cancel
          </button>
          <button id="modal-confirm" class="btn-primary" disabled
            style="flex: 1; height: 38px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
            <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span id="modal-confirm-text">Save to Collection</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // STATE
    // ==========================================
    let isAuthenticated = false;
    let isOptimizing = false;
    let currentOriginal = '';
    let currentOptimized = '';
    let hasGeneratedOnce = false;
    let isListening = false;
    let transcriptionSessionId = null;
    let isSaved = false;                 // Persistent saved state for current prompt
    let selectedCollectionId = null;     // Selected collection in modal
    let collectionsCache = [];           // Cached collections list
    let currentMode = 'fast';            // Current optimization mode

    // ==========================================
    // DOM REFS
    // ==========================================
    const viewAuth = document.getElementById('view-auth');
    const viewMain = document.getElementById('view-main');
    const btnClose = document.getElementById('btn-close');
    const btnOpenApp = document.getElementById('btn-open-app');
    const promptInput = document.getElementById('prompt-input');
    const btnGenerate = document.getElementById('btn-generate');
    const btnGenerateText = document.getElementById('btn-generate-text');
    const iconGenerate = document.getElementById('icon-generate');
    const iconSpinner = document.getElementById('icon-spinner');
    const btnRegenerate = document.getElementById('btn-regenerate');
    const btnVoice = document.getElementById('btn-voice');
    const iconMic = document.getElementById('icon-mic');
    const iconMicListening = document.getElementById('icon-mic-listening');
    const voiceStatusText = document.getElementById('voice-status-text');
    const resultSection = document.getElementById('result-section');
    const resultText = document.getElementById('result-text');
    const resultContainer = document.getElementById('result-container');
    const statusBadge = document.getElementById('status-badge');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnCopy = document.getElementById('btn-copy');
    const btnCopyText = document.getElementById('btn-copy-text');
    const btnInsert = document.getElementById('btn-insert');
    const btnInsertText = document.getElementById('btn-insert-text');
    const btnSave = document.getElementById('btn-save');
    const btnSaveText = document.getElementById('btn-save-text');
    const iconSave = document.getElementById('icon-save');
    const btnModeFast = document.getElementById('btn-mode-fast');
    const btnModeThinking = document.getElementById('btn-mode-thinking');

    // Modal refs
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalClose = document.getElementById('modal-close');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');
    const modalConfirmText = document.getElementById('modal-confirm-text');
    const collectionListEl = document.getElementById('collection-list');
    const newCollectionInput = document.getElementById('new-collection-input');
    const btnAddCollection = document.getElementById('btn-add-collection');
    const saveTitleInput = document.getElementById('save-title-input');

    // ==========================================
    // VIEW MANAGEMENT
    // ==========================================
    function showView(view) {
      viewAuth.classList.remove('active');
      viewMain.classList.remove('active');
      view.classList.add('active');
    }

    function resetToInput() {
      promptInput.value = '';
      currentOriginal = '';
      currentOptimized = '';
      isOptimizing = false;
      isSaved = false;
      resultText.textContent = '';
      resultSection.classList.remove('visible');
      setGenerateIdle();
      resetSaveButton();
      promptInput.disabled = false;
      btnGenerate.disabled = false;

      // Reset Replace button — may have been left disabled/modified from previous session
      btnInsert.disabled = false;
      btnInsertText.textContent = 'Replace';
      btnInsert.style.background = '';

      requestAnimationFrame(() => {
        setTimeout(() => promptInput.focus(), 80);
      });
    }

    // ==========================================
    // STATUS PILL
    // ==========================================
    function setStatus(type, label) {
      statusText.textContent = label;
      statusBadge.className = 'status-pill ' + type;
    }

    // ==========================================
    // GENERATE BUTTON STATE
    // ==========================================
    function setGenerateLoading() {
      iconGenerate.style.display = 'none';
      iconSpinner.style.display = 'block';
      btnGenerateText.textContent = 'Optimizing...';
      btnGenerate.disabled = true;
      promptInput.disabled = true;
      btnRegenerate.disabled = true;
    }

    function setGenerateIdle() {
      iconGenerate.style.display = 'block';
      iconSpinner.style.display = 'none';
      btnGenerateText.textContent = 'Optimize';
      btnGenerate.disabled = false;
      promptInput.disabled = false;

      if (hasGeneratedOnce) {
        btnRegenerate.style.display = 'flex';
        btnRegenerate.disabled = false;
      }
    }

    // ==========================================
    // OPTIMIZATION
    // ==========================================
    function startOptimization(text, isRegenerate) {
      if (!text.trim() || isOptimizing) return;

      isOptimizing = true;
      currentOriginal = text;
      currentOptimized = '';
      resetSaveButton();

      resultSection.classList.add('visible');
      resultText.innerHTML = '<span class="thinking-dots" style="color: hsl(var(--muted-foreground));">Thinking</span>';
      setStatus(isRegenerate ? 'optimizing' : 'optimizing', isRegenerate ? 'Regenerating' : 'Optimizing');
      setGenerateLoading();

      if (window.electronAPI?.overlay?.optimize) {
        window.electronAPI.overlay.optimize({ text, isRegenerate: !!isRegenerate, mode: currentMode });
      }
    }

    // ==========================================
    // COPY / SAVE FEEDBACK
    // ==========================================
    function showCopyFeedback() {
      const prev = btnCopyText.textContent;
      btnCopyText.textContent = '✓ Copied!';
      btnCopy.classList.add('flash-success');
      setTimeout(() => {
        btnCopyText.textContent = prev;
        btnCopy.classList.remove('flash-success');
      }, 1800);
    }

    // ==========================================
    // SAVE BUTTON STATE MANAGEMENT
    // ==========================================

    function resetSaveButton() {
      isSaved = false;
      btnSave.disabled = false;
      btnSave.classList.remove('btn-saved', 'flash-success');
      btnSaveText.textContent = 'Save to Library';
      iconSave.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>';
    }

    function setSavedPermanently() {
      isSaved = true;
      btnSave.disabled = true;
      btnSave.classList.add('btn-saved');
      btnSave.classList.remove('flash-success');
      iconSave.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>';
      btnSaveText.textContent = '✓ Saved';
    }

    function showSaveError() {
      btnSaveText.textContent = '✗ Failed';
      btnSave.disabled = false;
      setTimeout(() => {
        if (!isSaved) {
          btnSaveText.textContent = 'Save to Library';
        }
      }, 2000);
    }

    // ==========================================
    // COLLECTION PICKER MODAL
    // ==========================================

    function updateConfirmState() {
      // Enable confirm only when both a title and a collection are set
      modalConfirm.disabled = !(selectedCollectionId && saveTitleInput.value.trim());
    }

    saveTitleInput.addEventListener('input', updateConfirmState);

    async function openCollectionPicker() {
      selectedCollectionId = null;
      modalConfirm.disabled = true;
      modalBackdrop.classList.add('open');

      // Pre-fill title from the original prompt
      const autoTitle = currentOriginal.substring(0, 80).trim();
      saveTitleInput.value = autoTitle;

      // Render loading
      collectionListEl.innerHTML = '<div style="padding: 24px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 12px;">Loading collections...</div>';

      try {
        collectionsCache = await window.electronAPI.overlay.getCollections();
        renderCollections(collectionsCache);
      } catch (err) {
        collectionListEl.innerHTML = '<div style="padding: 24px; text-align: center; color: hsl(0 72% 51%); font-size: 12px;">Failed to load collections</div>';
      }
    }

    function closeCollectionPicker() {
      modalBackdrop.classList.remove('open');
      selectedCollectionId = null;
      newCollectionInput.value = '';
      saveTitleInput.value = '';
      btnAddCollection.disabled = true;
      modalConfirmText.textContent = 'Save to Collection';
    }

    function renderCollections(collections) {
      if (!collections || collections.length === 0) {
        collectionListEl.innerHTML = '<div style="padding: 20px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 12px;">No collections yet. Create one below.</div>';
        return;
      }

      collectionListEl.innerHTML = '';
      collections.forEach((col) => {
        const btn = document.createElement('button');
        btn.className = 'collection-item';
        if (col.id === selectedCollectionId) btn.classList.add('selected');
        btn.innerHTML = '<svg style="width: 14px; height: 14px; flex-shrink: 0; color: hsl(var(--muted-foreground));" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>'
          + '<span class="collection-name">' + escapeHtml(col.name) + '</span>';
        btn.addEventListener('click', () => {
          selectedCollectionId = col.id;
          collectionListEl.querySelectorAll('.collection-item').forEach(el => el.classList.remove('selected'));
          btn.classList.add('selected');
          updateConfirmState();
        });
        collectionListEl.appendChild(btn);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Create new collection inline
    newCollectionInput.addEventListener('input', () => {
      btnAddCollection.disabled = !newCollectionInput.value.trim();
    });

    newCollectionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && newCollectionInput.value.trim()) {
        createNewCollection();
      }
    });

    btnAddCollection.addEventListener('click', () => {
      if (newCollectionInput.value.trim()) createNewCollection();
    });

    async function createNewCollection() {
      const name = newCollectionInput.value.trim();
      if (!name) return;

      btnAddCollection.disabled = true;
      btnAddCollection.textContent = '...';

      try {
        const newCol = await window.electronAPI.overlay.createCollection(name);
        collectionsCache.unshift(newCol);
        selectedCollectionId = newCol.id;
        renderCollections(collectionsCache);
        updateConfirmState();
        newCollectionInput.value = '';
        btnAddCollection.textContent = 'Create';
      } catch (err) {
        btnAddCollection.textContent = 'Error';
        setTimeout(() => { btnAddCollection.textContent = 'Create'; btnAddCollection.disabled = false; }, 1500);
      }
    }

    // Modal buttons
    modalClose.addEventListener('click', closeCollectionPicker);
    modalCancel.addEventListener('click', closeCollectionPicker);

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeCollectionPicker();
    });

    modalConfirm.addEventListener('click', async () => {
      const title = saveTitleInput.value.trim();
      if (!selectedCollectionId || !currentOptimized || !title) return;

      modalConfirm.disabled = true;
      modalConfirmText.textContent = 'Saving...';

      try {
        await window.electronAPI.overlay.save({
          title: title,
          content: currentOptimized,
          collectionId: selectedCollectionId,
        });

        closeCollectionPicker();
        setSavedPermanently();
      } catch (err) {
        modalConfirmText.textContent = 'Failed — Retry';
        modalConfirm.disabled = false;
        setTimeout(() => { modalConfirmText.textContent = 'Save to Collection'; }, 2000);
      }
    });

    // ==========================================
    // EVENT LISTENERS
    // ==========================================

    btnModeFast.addEventListener('click', () => {
      currentMode = 'fast';
      btnModeFast.style.background = 'hsl(var(--emerald))';
      btnModeFast.style.color = 'white';
      btnModeFast.style.boxShadow = '0 1px 2px rgba(0,0,0,0.1)';
      btnModeThinking.style.background = 'transparent';
      btnModeThinking.style.color = 'hsl(var(--muted-foreground))';
      btnModeThinking.style.boxShadow = 'none';
    });

    btnModeThinking.addEventListener('click', () => {
      currentMode = 'thinking';
      btnModeThinking.style.background = '#3b82f6';
      btnModeThinking.style.color = 'white';
      btnModeThinking.style.boxShadow = '0 1px 2px rgba(0,0,0,0.1)';
      btnModeFast.style.background = 'transparent';
      btnModeFast.style.color = 'hsl(var(--muted-foreground))';
      btnModeFast.style.boxShadow = 'none';
    });

    btnClose.addEventListener('click', () => {
      if (window.electronAPI?.overlay?.close) window.electronAPI.overlay.close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.electronAPI?.overlay?.close) window.electronAPI.overlay.close();
      }
    });

    btnOpenApp.addEventListener('click', () => {
      if (window.electronAPI?.overlay?.openApp) window.electronAPI.overlay.openApp();
    });

    btnGenerate.addEventListener('click', () => {
      const text = promptInput.value.trim();
      if (text) startOptimization(text, false);
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = promptInput.value.trim();
        if (text && !isOptimizing) startOptimization(text, false);
      }
    });

    btnRegenerate.addEventListener('click', () => {
      if (currentOriginal && !isOptimizing) {
        startOptimization(currentOriginal, true);
      }
    });

    btnCopy.addEventListener('click', () => {
      if (currentOptimized) {
        if (window.electronAPI?.overlay?.copy) {
          window.electronAPI.overlay.copy(currentOptimized);
        }
        showCopyFeedback();
      }
    });

    // ==========================================
    // REPLACE — send optimized text back into the original window
    // ==========================================
    btnInsert.addEventListener('click', async () => {
      if (!currentOptimized || btnInsert.disabled) return;

      // Show in-progress state
      btnInsert.disabled = true;
      btnInsertText.textContent = 'Replacing...';

      try {
        const result = await window.electronAPI.overlay.insert(currentOptimized);

        if (result && result.success) {
          // Success feedback — overlay will close (handled by Rust), just show tick
          btnInsertText.textContent = '✓ Replaced!';
          btnInsert.style.background = 'linear-gradient(135deg, hsl(142 76% 36%), hsl(158 64% 30%))';
        } else if (result && result.fallback === 'clipboard') {
          // Native bridge unavailable — text was copied instead
          btnInsertText.textContent = '📋 Copied (no native bridge)';
          setTimeout(() => {
            btnInsertText.textContent = 'Replace';
            btnInsert.disabled = false;
            btnInsert.style.background = '';
          }, 2500);
        } else {
          // Returned false — window may have been closed
          btnInsertText.textContent = '✗ Window lost focus';
          setTimeout(() => {
            btnInsertText.textContent = 'Replace';
            btnInsert.disabled = false;
          }, 2000);
        }
      } catch (err) {
        btnInsertText.textContent = '✗ Failed';
        setTimeout(() => {
          btnInsertText.textContent = 'Replace';
          btnInsert.disabled = false;
        }, 2000);
      }
    });

    btnSave.addEventListener('click', () => {
      if (!currentOptimized || isSaved) return;
      openCollectionPicker();
    });

    // ==========================================
    // VOICE INPUT
    // ==========================================

    function startVoiceInput() {
      if (isListening) return;

      isListening = true;
      transcriptionSessionId = Date.now().toString();

      // UI update
      iconMic.style.display = 'none';
      iconMicListening.style.display = 'block';
      voiceStatusText.textContent = 'Listening...';
      voiceStatusText.style.color = 'hsl(0 72% 51%)';
      btnVoice.classList.add('listening');

      if (window.electronAPI?.transcription?.start) {
        window.electronAPI.transcription.start(transcriptionSessionId);
      }
    }

    function stopVoiceInput() {
      if (!isListening) return;

      isListening = false;

      iconMic.style.display = 'block';
      iconMicListening.style.display = 'none';
      voiceStatusText.textContent = 'Voice';
      voiceStatusText.style.color = '';
      btnVoice.classList.remove('listening');

      if (window.electronAPI?.transcription?.stop) {
        window.electronAPI.transcription.stop();
      }

      transcriptionSessionId = null;
    }

    btnVoice.addEventListener('click', () => {
      if (isListening) {
        stopVoiceInput();
      } else {
        startVoiceInput();
      }
    });

    // ==========================================
    // IPC LISTENERS
    // ==========================================

    if (window.electronAPI?.overlay?.onOpened) {
      window.electronAPI.overlay.onOpened((data) => {
        isAuthenticated = data.isAuthenticated;

        if (isAuthenticated) {
          showView(viewMain);
          resetToInput();
        } else {
          showView(viewAuth);
        }
      });
    }

    if (window.electronAPI?.overlay?.onAuthState) {
      window.electronAPI.overlay.onAuthState((data) => {
        isAuthenticated = data.isAuthenticated;

        if (!isAuthenticated && viewMain.classList.contains('active')) {
          showView(viewAuth);
        }
      });
    }

    if (window.electronAPI?.transcription?.onTranscription) {
      window.electronAPI.transcription.onTranscription((data) => {
        if (data.text) {
          promptInput.value = data.accumulated || data.text;
          promptInput.scrollTop = promptInput.scrollHeight;
        }
      });
    }

    if (window.electronAPI?.overlay?.onOptimizationChunk) {
      window.electronAPI.overlay.onOptimizationChunk((data) => {
        if (!isOptimizing) return;

        if (resultText.innerHTML.includes('thinking-dots')) {
          resultText.textContent = '';
        }

        resultText.textContent += data.chunk;
        resultContainer.scrollTop = resultContainer.scrollHeight;
      });
    }

    if (window.electronAPI?.overlay?.onOptimizationComplete) {
      window.electronAPI.overlay.onOptimizationComplete((data) => {
        isOptimizing = false;
        hasGeneratedOnce = true;
        currentOptimized = data.optimized || '';

        resultText.textContent = currentOptimized;
        resultContainer.scrollTop = resultContainer.scrollHeight;

        setStatus('ready', 'Done');
        setGenerateIdle();
      });
    }

    if (window.electronAPI?.overlay?.onOptimizationError) {
      window.electronAPI.overlay.onOptimizationError((data) => {
        isOptimizing = false;

        resultSection.classList.add('visible');
        resultText.textContent = 'Error: ' + (data.error || 'Unknown error');
        setStatus('error', 'Failed');
        setGenerateIdle();
      });
    }

    // ==========================================
    // DYNAMIC SETTINGS SYNC (Theme, Font, Size)
    // ==========================================

    function applySettings(settings) {
      if (!settings) return;

      const root = document.documentElement;

      // 1. Apply Theme
      if (settings.theme === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }

      // 2. Apply Font Size (matches Tailwind classes text-sm, text-base, text-lg)
      // Base styles use ~13px for inputs, so we scale the whole HTML root slightly
      if (settings.font_size === 'small') {
        root.style.fontSize = '14px';
      } else if (settings.font_size === 'large') {
        root.style.fontSize = '18px';
      } else {
        root.style.fontSize = '16px'; // medium default
      }

      // 3. Apply Font Family
      if (settings.font_family === 'mono') {
        root.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace';
      } else if (settings.font_family === 'serif') {
        root.style.fontFamily = 'ui-serif, Georgia, Cambria, "Times New Roman", Times, serif';
      } else { // 'inter' or default
        root.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";
      }
    }

    // Fetch initial settings on load
    if (window.electronAPI?.overlay?.getSettings) {
      window.electronAPI.overlay.getSettings().then(applySettings).catch(err => console.error('[Overlay] Failed to load settings:', err));
    }

    // Listen for live setting updates broadcast by the main app
    if (window.electronAPI?.overlay?.onSettingsUpdate) {
      window.electronAPI.overlay.onSettingsUpdate(applySettings);
    }
  </script>
