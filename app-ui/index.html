<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: https://res.cloudinary.com; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://api.cloudinary.com; frame-src blob: data: 'self'; object-src blob: 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt | Obsidian Core</title>
    <meta name="description" content="AI-Powered Prompt Optimizer" />
    <meta name="author" content="Prompt Optimizer Team" />

    <meta property="og:title" content="Prompt Optimizer" />
    <meta property="og:description" content="Global Desktop AI Assistant" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- CRITICAL: Blocking theme script — runs BEFORE first paint to prevent flash of wrong theme -->
    <!-- Reads theme from localStorage and applies it immediately, before React loads -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('prompt-weaver-settings');
          if (stored) {
            var settings = JSON.parse(stored);
            if (settings.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
            // Note: light theme = no class needed (default)
          } else {
            // No settings stored yet — default to dark
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // If anything fails, default to dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
