    <meta name="twitter:card" content="summary_large_image" />

    <!-- CRITICAL: Blocking theme script — runs BEFORE first paint to prevent FOUC.
         Light is the default (no class on <html>).
         Only adds "dark" when the user has an explicit stored dark preference.
         First-time users: no localStorage → stays light. -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('prompt-weaver-settings');
          if (stored) {
            var settings = JSON.parse(stored);
            if (settings.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) { }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
