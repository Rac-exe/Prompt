<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src blob: data: 'self'; object-src blob: 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prmpt Overlay</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('prompt-weaver-settings');
          var theme = stored ? JSON.parse(stored).theme : 'dark';
          if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Font loaded via CSS import in index.css (geist package) -->
  </head>
  <body style="margin:0; background:transparent;">
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
